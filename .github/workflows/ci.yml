name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            target: macos-arm64
          - os: macos-15-intel
            arch: x64
            target: macos-x64
          - os: ubuntu-22.04
            arch: x64
            target: linux-x64
          - os: windows-2022
            arch: x64
            target: windows-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.16.0"
          architecture: ${{ matrix.arch }}
          cache: npm
      - run: npm ci
      - run: node scripts/check-version.js
      - run: npm test
      - run: npm run test:release
      - run: npm run build
      - run: npm run build:smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: friendcoin-${{ matrix.target }}
          path: dist/friendcoin-*
          if-no-files-found: error
          retention-days: 7

  minimum-node:
    name: Test Node.js 22
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/check-version.js
      - run: npm test
      - run: npm run test:release
