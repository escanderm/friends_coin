name: Container CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Build and smoke test Docker archive
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      IMAGE_TAG: friendcoin-container-ci:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.16.0"
          cache: npm
      - name: Install smoke dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Build server image
        run: docker --host unix:///var/run/docker.sock build --pull --tag "$IMAGE_TAG" .
      - name: Test container runtime and persistence
        run: node scripts/smoke-container.js "$IMAGE_TAG"
